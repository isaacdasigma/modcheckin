<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkawords - Autumn Harvest</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <div class="a250-badge"><div class="a250-badge-inner">🍁 Autumn Harvest 🌾</div></div>
    <h1>CHECKAWORDS</h1>
    <div class="streak-badge" id="streak-display">🔥 Daily Streak: 0 Days</div>
  </header>

  <!-- Navigation Bar with Relative Links -->
  <nav class="game-nav">
    <a href="index.html" class="nav-link active">Checkawords</a>
    <a href="leaderboard.html" class="nav-link">🏆 Leaderboard</a>
    <a href="news.html" class="nav-link">📰 Daily Wire</a>
    <a href="chess.html" class="nav-link">Chess</a>
    <a href="checkers.html" class="nav-link">Checkers</a>
    <a href="sudoku.html" class="nav-link">Sudoku</a>
  </nav>

  <!-- Wordle Interface -->
  <main class="game-container">
    <div class="mode-selector">
      <button class="mode-btn" onclick="setWordMode(5)">5 Letters</button>
      <button class="mode-btn" onclick="setWordMode(6)">6 Letters</button>
      <button class="mode-btn active" onclick="setWordMode(7)">7 Letters</button>
    </div>
    <div class="status-box" id="wordle-msg"></div>
    <div id="grid"></div>
    <div id="keyboard"></div>
  </main>

  <script src="js/core.js"></script>
  <script src="js/wordle.js"></script>
</body>
</html>
