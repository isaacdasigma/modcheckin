<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check-a-Word | Autumn Arcade</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="arcade-card">
    <header class="card-header">
      <h1>🍁 Check-a-Word</h1>
      <p>Validate dictionary words and score points based on length!</p>
    </header>

    <section class="game-container">
      <form id="word-form" class="word-input-group">
        <input 
          type="text" 
          id="word-input" 
          placeholder="Enter a word..." 
          autocomplete="off"
          required 
        />
        <button type="submit" id="check-btn">Check Word</button>
      </form>

      <div id="result-badge" class="badge hidden" aria-live="polite"></div>

      <div id="word-details" class="details-panel hidden">
        <h2 id="definition-title"></h2>
        <p id="definition-text"></p>
        <div class="stats-row">
          <span id="score-val">Points: 0</span>
          <span id="length-val">Length: 0</span>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="word-checker.js"></script>
</body>
</html>
